[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "moonkit"
version = "0.0.1"
description = "A unified Python toolkit for lunar science. Placeholder release; under active development."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "moonkit contributors" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Homepage = "https://moonkit.org"
Source = "https://github.com/parthsidpara/moonkit"
Issues = "https://github.com/parthsidpara/moonkit/issues"

[tool.setuptools]
py-modules = ["moonkit"]
